name: Dados do painel da TV

on:
  schedule:
    # A cada 15 min, de segunda a sexta, das 07h as 20h (horario de Brasilia)
    - cron: '*/15 10-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calcular indicadores
        run: node scripts/gerar-dados-tv.mjs
        env:
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
      - name: Salvar dados
        run: |
          git config user.name "painel-tv-bot"
          git config user.email "painel-tv-bot@users.noreply.github.com"
          git add tv/dados.json
          git diff --cached --quiet || (git commit -m "Atualiza dados da TV" && git push)
